    <text x="400" y="636" fill="#ef5350">✕ mobile 390x844 — overflow 98px</text>
    <text x="1120" y="636" text-anchor="end" fill="#5f7b90" font-size="12">1.61s</text>

    <text x="80" y="676" fill="#22c55e">✓ 15 passed</text>
    <text x="250" y="676" fill="#ef5350">3 failed</text>
    <text x="360" y="676" fill="#f5b301">1 skipped</text>
    <text x="1120" y="676" text-anchor="end" fill="#9fb3c8" font-size="12">PASS/FAIL/SKIP + screenshots</text>
