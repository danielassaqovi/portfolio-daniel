    <text x="400" y="488" fill="#22c55e">✓ images load successfully</text>
    <text x="1120" y="488" text-anchor="end" fill="#5f7b90" font-size="12">2.13s</text>

    <text x="80" y="520" fill="#5f7b90" font-size="12">forms.spec.js</text>
    <text x="400" y="520" fill="#22c55e">✓ forms detected, controls have labels</text>
    <text x="1120" y="520" text-anchor="end" fill="#5f7b90" font-size="12">2.98s</text>

