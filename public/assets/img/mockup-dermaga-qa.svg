    <text x="800" y="258" font-size="34" font-weight="800" fill="#22c55e">83.3%</text>
    <rect x="960" y="230" width="160" height="10" rx="5" fill="#22323f"/>
    <rect x="960" y="230" width="133" height="10" rx="5" fill="#22c55e"/>
  </g>

  <!-- Test list -->
  <g font-family="Consolas, monospace" font-size="13">
    <rect x="60" y="306" width="1080" height="396" rx="6" fill="#0b141b" stroke="#2b3d4d"/>

