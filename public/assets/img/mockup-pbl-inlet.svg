  <text x="600" y="262" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Engineering Technology</text>
  <text x="600" y="306" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#c9d6ea">State Polytechnic of Malang</text>
